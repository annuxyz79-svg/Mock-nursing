</div>

<button class="primary" onclick="location.reload()">
🔄 Restart Test

options:[

],

{

options:[

],
correct:1
},

{
q:"मनुष्य में श्वसन के लिए मुख्य अंग कौन-सा है?",
options:[

],
correct:1

];


/* =================================================
   TEST SYSTEM
================================================= */

let current=0;

let answers=new Array(questions.length).fill(null);

let time=30*60;

let timerInterval;


/* QUESTION PALETTE */

function createPalette(){

let html="";

for(let i=0;i<questions.length;i++){

html+=`
<button id="p${i}"
onclick="goToQuestion(${i})">
${i+1}
</button>
`;

}

document.getElementById("palette").innerHTML=html;

updatePalette();

}


/* SHOW QUESTION */

function showQuestion(){

let q=questions[current];

let html=`

<div>
<b>Question ${current+1} / ${questions.length}</b>
</div>

<div class="question">
${q.q}
</div>
`;

q.options.forEach((option,index)=>{

html+=`

<label class="option">

<input
type="radio"
name="answer"
value="${index}"
${answers[current]===index?"checked":""}
onchange="selectAnswer(${index})">

${String.fromCharCode(65+index)}. ${option}

</label>

`;

});


html+=`<div class="buttons">`;

if(current>0){

html+=`
<button class="secondary"
onclick="previousQuestion()">
◀ Previous
</button>
`;

}

if(current<questions.length-1){

html+=`
<button class="primary"
onclick="nextQuestion()">
Next ▶
</button>
`;

}else{

html+=`
<button class="submit"
onclick="submitTest()">
Submit Test
</button>
`;

}

html+=`</div>`;

document.getElementById("quiz").innerHTML=html;

updatePalette();

}


/* SELECT ANSWER */

function selectAnswer(index){

answers[current]=index;

updatePalette();

}


/* PALETTE */

function updatePalette(){

questions.forEach((q,i)=>{

let button=document.getElementById("p"+i);

if(!button)return;

button.classList.remove("active","done");

if(i===current){

button.classList.add("active");

}

if(answers[i]!==null){

button.classList.add("done");

}

});

}


/* NEXT */

function nextQuestion(){

if(current<questions.length-1){

current++;

showQuestion();

}

}


/* PREVIOUS */

function previousQuestion(){

if(current>0){

current--;

showQuestion();

}

}


/* GO TO QUESTION */

function goToQuestion(index){

current=index;

showQuestion();

}


/* SUBMIT */

function submitTest(){

clearInterval(timerInterval);

let score=0;

let attempted=0;

let review="";

questions.forEach((q,i)=>{

if(answers[i]!==null){

attempted++;

}

if(answers[i]===q.correct){

score++;

}

review+=`

<p>

<b>Q${i+1}. ${q.q}</b><br>

Your answer:

<span class="${
answers[i]===q.correct ? "correct":"wrong"
}">

${
answers[i]===null
?"Not Attempted"
:q.options[answers[i]]
}

</span>

<br>

Correct answer:

<span class="correct">

${q.options[q.correct]}

</span>

</p>

`;

});


let wrong=attempted-score;

let percentage=
((score/questions.length)*100).toFixed(2);


document.getElementById("quiz").style.display="none";

document.getElementById("result").style.display="block";


document.getElementById("score").innerHTML=
score+" / "+questions.length;


document.getElementById("stats").innerHTML=
"Attempted: "+attempted+
"<br>Correct: "+score+
"<br>Wrong: "+wrong+
"<br>Unattempted: "+(questions.length-attempted)+
"<br>Percentage: "+percentage+"%";


document.getElementById("review").innerHTML=
"<h3>📖 Answer Review</h3>"+review;

}


/* TIMER */

function startTimer(){

timerInterval=setInterval(()=>{

time--;

let minutes=Math.floor(time/60);

let seconds=time%60;

document.getElementById("timer").innerHTML=

String(minutes).padStart(2,"0")
+
":"
+
String(seconds).padStart(2,"0");


if(time<=0){

clearInterval(timerInterval);

submitTest();

}

},1000);

}


/* START */

createPalette();

showQuestion();

startTimer();

</script>
